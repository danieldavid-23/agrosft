{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSFT - Gestión Agrícola Inteligente</title>
    <meta name="description" content="AgroSFT integra inventario, marketplace, compras y facturación en una sola plataforma moderna y segura diseñada para el sector agrícola.">
    <link rel="shortcut icon" href="{% static 'img/agrosft_o.svg' %}">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Landing Styles (GitHub Theme) -->
    <link href="{% static 'dist/css/landing.css' %}?_v=20260916_1" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
        }

        #vue-landing {
            min-height: 100vh;
        }
    </style>
</head>

<body>
    <!-- Context Processor Global Data -->
    {{ layout_data|json_script:"layout-data" }}

    <!-- Vue Landing Root Mount -->
    <div id="vue-landing">
        <!-- Initial Pre-loader skeleton / placeholder while bundle loads -->
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1117; color: #3fb950; font-family: 'Inter', sans-serif;">
            <div style="text-align: center;">
                <img src="{% static 'img/agrosft_o.svg' %}" alt="AgroSFT" style="width: 56px; height: 56px; margin-bottom: 1rem; animation: pulse 1.5s infinite;">
                <div style="font-size: 1.1rem; font-weight: 700; color: #f0f6fc; letter-spacing: -0.02em;">Agro<span style="color: #2ea043;">SFT</span></div>
                <div style="font-size: 0.85rem; color: #8b949e; margin-top: 0.35rem;">Cargando plataforma agrícola...</div>
            </div>
        </div>
    </div>

    <!-- Vue Bundle -->
    <script type="module" src="{% static 'dist/landing.js' %}?_v=20260916_1"></script>
</body>

</html>
