{% extends 'base.html' %}

{% block title %}Contraseña Restablecida - AGROSFT{% endblock %}

{% block content %}
<style>
    .auth-page {
        min-height: calc(100vh - 170px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
        font-family: 'Inter', sans-serif;
    }

    .auth-page * {
        box-sizing: border-box;
        font-family: 'Inter', sans-serif;
    }

    .auth-page a {
        text-decoration: none;
    }

    .auth-page button {
        appearance: none;
        -webkit-appearance: none;
        font-family: 'Inter', sans-serif;
    }

    .auth-card {
        width: 100%;
        max-width: 460px;
        background: #ffffff;
        border-radius: 22px;
        overflow: hidden;
        text-align: center;
        box-shadow:
            0 1px 2px rgba(16, 40, 20, 0.04),
            0 4px 10px rgba(16, 40, 20, 0.05),
            0 20px 50px rgba(16, 40, 20, 0.10);
    }

    .auth-card-body {
        padding: 3rem 2.5rem;
    }

    .auth-msg-icon {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        font-size: 1.8rem;
    }

    .auth-msg-icon.success {
        background: linear-gradient(135deg, #e6f6e6, #d0ecd0);
        color: #2f855a;
        box-shadow: 0 8px 22px rgba(60, 141, 60, 0.16);
    }

    .auth-card-body h3 {
        margin: 0 0 0.75rem 0;
        color: #27402d;
        font-size: 1.35rem;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .auth-card-body p {
        margin: 0;
        color: #74837a;
        font-size: 0.9rem;
        line-height: 1.6;
    }

    .auth-btn-primary {
        height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0 2rem;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #3C8D3C 0%, #25632C 100%);
        color: #ffffff;
        font-size: 0.92rem;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: pointer;
        margin-top: 1.5rem;
        box-shadow: 0 4px 14px rgba(60, 141, 60, 0.30);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative;
        overflow: hidden;
    }

    .auth-btn-primary::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
        transition: left 0.5s ease;
    }

    .auth-btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(60, 141, 60, 0.40);
    }

    .auth-btn-primary:hover::after {
        left: 100%;
    }

    @media (max-width: 480px) {
        .auth-page {
            padding: 1.25rem 0.75rem;
        }

        .auth-card {
            border-radius: 18px;
        }

        .auth-card-body {
            padding: 2rem 1.25rem;
        }
    }
</style>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-card-body">
            <div class="auth-msg-icon success"><i class="fas fa-shield-check"></i></div>
            <h3>Contraseña Restablecida</h3>
            <p>Tu contraseña ha sido modificada correctamente. Ya puedes acceder a tu cuenta con tu nueva contraseña.
            </p>
            <a href="{% url 'usuarios:login' %}" class="auth-btn-primary">
                <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
            </a>
        </div>
    </div>
</div>
{% endblock %}
